<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <title>RIVER.EYE · 3D Cinematic River Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- CesiumJS for authentic real Earth geospatial globe -->
    <link
      href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  </head>
  <body>
    <div id="landing-root"></div>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="ui-root"></div>
      <div id="loading">
        <div class="card">
          <div class="card-kicker"><span class="card-kicker-dot"></span> LIVE HYDROLOGY VIEW</div>
          <h1>MULA–MUTHA JOURNEY</h1>
          <p id="load-msg">Preparing your river journey…</p>
          <span class="loading-subtitle">Loading terrain, water depths and river flow</span>
          <div class="loading-progress"><div class="bar"><i id="load-bar"></i></div><output id="load-percent">0%</output></div>
          <div class="loading-foot"><span>RIVER SYSTEM</span><span class="loading-pulse">•</span><span>3D VISUALIZATION</span><span class="loading-pulse">•</span><span>INITIALIZING</span></div>
        </div>
      </div>
      <!-- Compact droplet loader — flood sync only (src/ui/appLoader.js) -->
      <div id="app-loader" class="app-loader" hidden aria-live="polite" aria-busy="false">
        <div class="app-loader__chip">
          <div class="app-loader__mark" aria-hidden="true">
            <span class="app-loader__ring"></span>
            <span class="app-loader__ripple"></span>
            <span class="app-loader__ripple app-loader__ripple--delay"></span>
            <svg class="app-loader__drop" viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M12 2.2C12 2.2 5.5 10.1 5.5 14.2a6.5 6.5 0 0 0 13 0C18.5 10.1 12 2.2 12 2.2z"/>
            </svg>
          </div>
          <div class="app-loader__copy">
            <span class="app-loader__msg" id="app-loader-msg">Synchronizing Data</span>
            <div class="app-loader__bar" id="app-loader-bar" hidden>
              <i id="app-loader-bar-fill"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

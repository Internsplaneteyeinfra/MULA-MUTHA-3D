<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mula–Mutha River Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="ui-root"></div>
      <div id="loading">
        <canvas id="loading-scene" aria-hidden="true"></canvas>
        <div class="card">
          <div class="card-kicker"><span class="card-kicker-dot"></span> LIVE HYDROLOGY VIEW</div>
          <h1>MULA–MUTHA JOURNEY</h1>
          <p id="load-msg">Preparing your river journey…</p>
          <span class="loading-subtitle">Loading terrain, water depths and river flow</span>
          <div class="loading-progress"><div class="bar"><i id="load-bar"></i></div><output id="load-percent">0%</output></div>
          <div class="loading-foot"><span>RIVER SYSTEM</span><span class="loading-pulse">•</span><span>3D VISUALIZATION</span><span class="loading-pulse">•</span><span>INITIALIZING</span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
